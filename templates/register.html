<!DOCTYPE html>
<html>
<head>
    <title>Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Video de fondo -->
    <video autoplay muted loop id="background-video">
        <source src="/static/videos/tu-video.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de videos.
    </video>

    <!-- Logo en la esquina -->
    <img src="/static/images/tu-logo.png" alt="Logo" class="logo">

    <main>
        <!-- GIF encima del título -->
        <img src="/static/images/turbogif.gif" alt="GIF animado" style="width: 600px; display: block; margin: 0 auto;">

        <h1>Registro</h1>
        <form method="POST">
            <input type="text" name="username" placeholder="Nombre de Usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="styled-button"><i class="fas fa-user-plus"></i> Registrarse</button>
        </form>
        <p>¿Ya tienes una cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a></p>
    </main>
</body>
</html>
